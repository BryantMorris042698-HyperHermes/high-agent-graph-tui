[package]
name = "high-agent-graph-tui"
version = "0.1.0"
edition = "2021"
authors = ["Bryant Issiah Morris Jr. <bryant@hyperhermes.dev>"]
description = "High-Agent Graph_x_0x0: Mathematical codebase analysis TUI with Φ(G) regime engine, deviation detection, and Python mirror for Hermes integration"
license = "MIT"
repository = "https://github.com/BryantMorris042698-HyperHermes/high-agent-graph-tui"

[dependencies]
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"], optional = true }

[features]
default = []
tui = ["dep:ratatui", "dep:crossterm"]
full = ["tui", "dep:tokio"]

[[bin]]
name = "high-agent-tui"
path = "src/bin/tui.rs"
required-features = ["tui"]

[[bin]]
name = "high-agent"
path = "src/main.rs"
